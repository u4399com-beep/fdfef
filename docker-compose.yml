services:
  novel-system:
    build: .
    image: novel-system:latest
    container_name: novel-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      # 云端隐身采集（可选）：配置后可使用 Hyperbrowser 抓取策略
      - HYPERBROWSER_API_KEY=${HYPERBROWSER_API_KEY:-}
      - TZ=Asia/Shanghai
    volumes:
      # 数据库持久化（SQLite）
      - ./db:/app/db
      # 本地文件持久化（封面 webp / 章节 txt / 下载文件）
      - ./storage:/app/storage
      - ./download:/app/download
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
