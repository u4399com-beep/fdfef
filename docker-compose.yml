services:
  novel-system:
    build:
      context: .
      args:
        # 一键启用 JS 渲染策略：INSTALL_PLAYWRIGHT=true docker compose up -d --build
        - INSTALL_PLAYWRIGHT=${INSTALL_PLAYWRIGHT:-false}
    image: novel-system:latest
    container_name: novel-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      # 后台会话签名密钥（可选，>=16 字符）：不设置时自动生成 db/auth-secret 文件持久化
      - AUTH_SECRET=${AUTH_SECRET:-}
      # 云端隐身采集（可选）：配置后可使用 Hyperbrowser 抓取策略
      - HYPERBROWSER_API_KEY=${HYPERBROWSER_API_KEY:-}
      # 验证码自动识别·自定义视觉通道（可选，部署环境无平台凭证时启用）：
      # 任意 OpenAI 兼容视觉 API（智谱 GLM-4V / OpenAI / 本地 Ollama 等），三者齐全生效
      - CAPTCHA_VISION_API_BASE=${CAPTCHA_VISION_API_BASE:-}
      - CAPTCHA_VISION_API_KEY=${CAPTCHA_VISION_API_KEY:-}
      - CAPTCHA_VISION_MODEL=${CAPTCHA_VISION_MODEL:-}
      - TZ=Asia/Shanghai
    volumes:
      # 数据库持久化（SQLite；git clone 自带全部在库数据）
      - ./db:/app/db
      # 本地文件持久化（封面 webp / 章节 txt / WAF 通行 cookie）
      - ./storage:/app/storage
      - ./download:/app/download
    healthcheck:
      # debian slim 基底无 wget/curl，用容器内自带的 bun 发起探活（与 Dockerfile 保持一致）
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
